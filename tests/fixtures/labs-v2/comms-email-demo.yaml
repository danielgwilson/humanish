schema: humanish.lab.v2
id: comms-email-demo
title: Email-gated signup with the in-sandbox mail catch (dry run)
description: >-
  Two personas sign up for an app whose signup sends a verification email with a magic link. The
  comms block sends the app's email API calls to a catch inside the subject sandbox, so no mail
  leaves the machine, and each persona is told its own inbox address, the inbox URL, and that
  waiting for an email is a normal next step. Committed as a dry run, which builds a dry-run bundle
  at no cost. It starts no sandbox and needs no keys or network. For the live study, set mode: live
  in a gitignored .humanish/labs/ copy.
subject:
  source: clone
  repos:
    - example-org/user-app # a public app whose signup emails a verification link
  serve:
    install: pnpm install --frozen-lockfile
    start: pnpm start
    url: http://127.0.0.1:3000/
comms:
  email:
    injectEnv: RESEND_BASE_URL # adopter-named: the env var YOUR app reads for its email-API
      # base URL. The harness points it at the in-sandbox catch. The official Resend SDK reads
      # RESEND_BASE_URL itself (resend@6: `process.env.RESEND_BASE_URL || "https://api.resend.com"`),
      # so an app on stock Resend needs no code change. Other providers are not all like that —
      # verify the app passes the env through, since a live run whose catch captured zero sends
      # warns at teardown for exactly this.
      #
      # No `recipients` list: every participant below automatically gets its own deterministic
      # address (signup-a@example.test, signup-b@example.test) and its prompt carries the
      # full handoff — the address to sign up with, the inbox URL, and the wait steering.
      # Declare recipients only to customize addresses or limit which participants do email; a
      # recipient naming a participant id that does not exist is a hard parse error.
actors:
  - type: openai-computer-use # REAL dispatch key: resolves in the actor registry
    mission: Sign up with the email address in your instructions, verify it from your inbox, and reach the dashboard.
    lanes:
      - id: signup-a
        persona: first-time-visitor
        instruction: Create an account, complete the email verification, and stop at the dashboard.
      - id: signup-b
        persona: impatient-skimmer
        instruction: Create an account; if any step is confusing, note the friction — but complete the email verification before stopping.
execution:
  target: e2b-desktop # both participants run at once (the default: concurrency = participant count)
  # 20 minutes. A signup-plus-wait-for-email flow is the LONGEST thing this harness runs, and this
  # lab used to ship 180s — every adopter copying it started in a hole. 20m + the clone route's 30m
  # provisioning + 10m teardown headroom exactly fits the 1-hour sandbox cap.
  timeoutMs: 1200000 # PER-PARTICIPANT session budget
scenario:
  mode: dry-run # committed fixture stays contract-only; live needs OPENAI_API_KEY + E2B_API_KEY
defaults:
  open: false
