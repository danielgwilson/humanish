  <rect class="bg" width="64" height="64" rx="14"/>
  <text x="32" y="43" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30"><tspan class="p">(</tspan><tspan class="ish" font-style="italic">ish</tspan><tspan class="p">)</tspan></text>
