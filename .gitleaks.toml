# gitleaks configuration.
#
# The default ruleset, plus ONE narrow exception. Everything about this file should be read as
# hostile to itself: an allowlist in a secret scanner is how a real leak eventually gets through,
# so the exception below is scoped to a single key prefix in a single file and is justified by the
# vendor's own published policy rather than by our convenience.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [[rules.allowlists]]
  description = """
  humanish's PostHog CAPTURE key (phc_). PostHog documents two classes of credential: public
  POST-only capture keys, which are meant to be embedded in client code, and private keys, which
  are not. Their published leaked-key policy auto-rolls phx_ (personal), phs_ (project secret),
  pha_ and phr_ (OAuth) — and deliberately does NOT list phc_, because a capture key can write
  events and read nothing. Next.js ships its telemetry key the same way.

  DO NOT widen this to the other prefixes. phs_, phx_, pha_ and phr_ must keep failing this scan;
  if one of those ever appears in this repo it is a real incident.
  """
  # AND, not the default OR. With OR, naming the file here would excuse EVERY secret in it.
  # Verified rather than assumed: a phs_ project-secret key, in the same line shape and the same
  # file, is still caught with this config — only the phc_ capture key passes.
  condition = "AND"
  regexes = ['''phc_[A-Za-z0-9]{20,}''']
  paths = ['''src/telemetry\.ts''', '''dist/telemetry\.js''']

  [[rules.allowlists]]
  description = """
  Credential PLUMBING, not credentials. The nested-grant code passes key VALUES between functions,
  so lines like `operatorKey: args.operatorE2bKey ?? ""` and `operatorE2bKey: env.E2B_API_KEY`
  match the generic rule on shape alone -- the thing after the colon is a variable reference,
  never a literal.

  Scoped so it cannot excuse a real key: the regex matches ONLY an identifier expression
  (`args.foo`, `env.FOO`), which no actual credential can look like, AND it applies only in the
  two files that do this plumbing. A hardcoded key literal in these same files is still caught --
  verified, not assumed, the same way the phc_ entry above was.
  """
  condition = "AND"
  regexes = ['''^(?:args|env|config|process|grant|runtimeEnv|result)[.][A-Za-z0-9_.]+$''']
  paths = ['''src/e2b-terminal-lab[.]ts''', '''src/nested-sandbox-grant[.]ts''']
