# gitleaks configuration.
#
# Default rules plus two narrow exceptions under generic-api-key. Keep both
# conditions conjunctive: neither an entire file nor all checksums are exempt.
# The public capture-key policy and exact public signing-key digest are explained
# beside their exceptions. Private credentials must continue to fail scanning.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [[rules.allowlists]]
  description = """
  humanish's PostHog CAPTURE key (phc_). PostHog documents two classes of credential: public
  POST-only capture keys, which are meant to be embedded in client code, and private keys, which
  are not. Their published leaked-key policy auto-rolls phx_ (personal), phs_ (project secret),
  pha_ and phr_ (OAuth) — and deliberately does NOT list phc_, because a capture key can write
  events and read nothing. Next.js ships its telemetry key the same way.

  DO NOT widen this to the other prefixes. phs_, phx_, pha_ and phr_ must keep failing this scan;
  if one of those ever appears in this repo it is a real incident.
  """
  # AND, not the default OR. With OR, naming the file here would excuse EVERY secret in it.
  # Verified rather than assumed: a phs_ project-secret key, in the same line shape and the same
  # file, is still caught with this config — only the phc_ capture key passes.
  condition = "AND"
  regexes = ['''phc_[A-Za-z0-9]{20,}''']
  paths = ['''src/telemetry\.ts''', '''dist/telemetry\.js''']

  [[rules.allowlists]]
  description = "Exact SHA256 of the pinned public Amazon Linux repository signing key"
  # This is a checksum, not a credential. Match the whole JSON field and file so
  # a different value, field, path, or additional credential is still scanned.
  # Content-based scope also survives the repository's required squash merges.
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"signingKeySha256": "664b632018bd84f9b249be7bd26937c560edb2f2bfc0cbc01ec5a7b4e06aad56",?\s*$''']
  paths = ['''^runtime/runtime-assets/inputs\.json$''']
