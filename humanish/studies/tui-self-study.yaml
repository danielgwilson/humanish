schema: humanish.study.v3
id: tui-self-study
title: Can a developer get an answer out of the humanish TUI? (self-study, desktop)
description: >-
  humanish watching someone use humanish. A computer-use participant sits at a desktop with a
  terminal open and humanish installed, and is asked to answer a question with it the way a person
  evaluating the tool would: by looking at the screen and typing. It runs on the computer-use route
  because this participant sees the screen and reacts to it, which is how to learn whether a screen
  works for a person. The terminal route can reach the TUI too, since codex exec allocates a PTY
  for its commands (handed-a-human-surface showed this); the routes differ in who is watching. Read
  afterwards: 1) where the participant stopped and looked, since the screenshot timeline shows
  which screens cost time; 2) whether it found how to start a run, and understood which run is free
  and which spends; 3) which keys it used (arrows, enter, esc, ?), since a key nobody presses is
  undiscoverable or unnecessary and the recording shows which; 4) what it said unprompted, the
  closest thing to a think-aloud protocol. The mission names no keystrokes: it says what to find
  out, because a mission that listed the keys would test whether the participant follows
  instructions.
route: computer-use
mode: dry-run # committed fixture stays contract-only
subject:
  source: desktop-cli
  product:
    name: humanish
    # Runs UNKEYED before the participant arrives: this is a study of the surface, not of npm.
    # sudo -n: the provisioning step runs as the desktop user, and the global npm
    # prefix is root-owned on the stock template (EACCES without it).
    install: >-
      sudo -n npm install -g humanish@latest && mkdir -p /home/user/project && cd
      /home/user/project && humanish init --yes
    # The terminal opens HERE, in a project that already has studies in it. The first live run of
    # this lab put the participant in an empty home directory and asked them what studies the
    # project contained; they correctly reported there was no project and stopped. That finding
    # was about the lab.
    workdir: /home/user/project
    publicSurfaces:
      - https://www.npmjs.com/package/humanish
      - https://github.com/danielgwilson/humanish
actor:
  type: openai-computer-use
  maxOutputTokens: 8192 # bounds a stalled request's worst case, so the capped run can retry it
  persona: synthetic-new-user
  mission: >-
    You are evaluating a command-line tool called humanish that your team is considering. It is
    already installed on this machine. Using its interactive terminal interface, find out what
    studies this project already contains, pick the one that looks most interesting, and find out
    what it would cost to run it for real. Then stop and say what you found, what confused you, and
    whether you could tell how to start a real run. Do not start one.
caps:
  maxUsd: 5
execution:
  target: e2b-desktop
  timeoutMs: 600000
  desktop:
    resolution: [1440, 950]
defaults:
  open: false
