schema: humanish.study.v3
id: effort-contrast-demo
title: Does reasoning effort change the participant? One persona, one mission, two efforts
description: >-
  Two participants clone and drive the same app with the same persona and mission and differ only in the
  model's reasoning effort. Effort changes who the participant is, as a persona prompt does, so a
  participant that abandons at medium and completes at high is two different participants, not a broken
  instrument. Each trace records its effort in modelSettings.reasoningEffort. Compare, per participant:
  completion reason, action count and mix, time to the end, how early it stopped, whether it reported
  friction, the affordance classes it used, and the estimated cost, since a more capable participant costs
  more to recruit. If the two come back the same, effort does not change behavior on this task. One run
  proves nothing about scale or repeatability. See docs/principles/actor-fidelity.md. Committed as a dry
  run, which builds a dry-run bundle at no cost. A live run needs OPENAI_API_KEY, E2B_API_KEY and a
  gitignored .humanish/labs/ copy with mode: live.
route: computer-use
mode: dry-run # committed fixture stays contract-only
subject:
  source: clone
  repos:
    - drawdb-io/drawdb # the same public OSS subject the persona contrast uses, for comparability
  clone:
    depth: 1
  serve:
    install: npm install --no-audit --no-fund
    build: npm run build
    start: npx vite preview --host 127.0.0.1 --port 3000
    url: http://127.0.0.1:3000/
actor:
  type: openai-computer-use
  maxOutputTokens: 8192 # bounds a stalled request's worst case, so the capped run can retry it
  persona: synthetic-new-user # ONE persona for both participants: effort is the only declared difference
  mission: >-
    Create a small database diagram with at least two related tables, then stop.
  reasoningEffort: medium # the per-participant default, and the level every prior humanish run silently used
participants:
  - id: default-effort
    instruction: Build the diagram the way you normally would, and stop when you are done or blocked.
  - id: harder-effort
    reasoningEffort: high # the ONLY declared difference between the two participants
    instruction: Build the diagram the way you normally would, and stop when you are done or blocked.
caps:
  maxUsd: 15 # fail-closed per-participant spend abort; the run-level worst case is 2x this
execution:
  target: e2b-desktop # both participants live at once (the default: concurrency = participant count)
  timeoutMs: 1200000 # PER-PARTICIPANT budget; a short cap suppresses the axis under study — higher effort spends its gain on longer horizons
defaults:
  open: false
