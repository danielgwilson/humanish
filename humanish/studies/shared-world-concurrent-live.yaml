schema: humanish.study.v3
id: shared-world-concurrent-live
title: "Concurrent shared world, live: three participants on a synthetic task board"
description: >-
  Three personas drive one provisioned, mutable service at the same time, backed by a synthetic app.
  One subject sandbox clones this public repo, serves the committed fixture
  humanish/fixtures/shared-world-app on 0.0.0.0, seeds it with a few starter tasks and exposes it
  through getHost; three participant desktops then open that URL at once and each add a task to the
  shared board. A background prober runs the read-only checkpoint probe, an aggregate of the task
  count and a sha256-16 hash with no row contents, on a cadence: a stateSeries that shows the shared
  task count grow under concurrent load. The cloned commit is recorded as the plane's provenance;
  the lab schema has no ref field, so the recorded commit is the pin. A dry run, the default, writes
  one verified concurrent shared-world bundle at no cost. A live run needs OPENAI_API_KEY,
  E2B_API_KEY and scenario.mode: live; tests/routes/shared-world/concurrent.live.test.ts runs it
  when HUMANISH_LIVE_SHARED_WORLD=1, as a separately authorized paid run.
route: shared-world # the declared override of the per-lane-worlds default (#164)
mode: dry-run # default safe; the gated live rung flips to live for the authorized paid receipt
subject:
  source: clone
  # SYNTHETIC subject attestation (REQUIRED on the concurrent route): the fixture is exposed on an
  # internet-reachable getHost URL for the run, so the author attests it is synthetic seeded data
  # (author-trust + a state.provenance == seeded gate, NOT a no-real-data guarantee).
  exposure: synthetic
  repos:
    - danielgwilson/humanish # clone THIS public repo; serve the committed fixture subdir
  clone:
    depth: 1 # shallow; the recorded HEAD commit is the plane provenance pin
  serve:
    # Pure Node built-ins — NO install/build step. Bind 0.0.0.0 (FIX-4): getHost only routes to a
    # port bound on all interfaces; the readiness probe below stays loopback. Python stdlib (the
    # E2B desktop image ships python3, not node) — NO install/build step.
    start: HOST=0.0.0.0 PORT=3000 python3 humanish/fixtures/shared-world-app/server.py
    url: http://127.0.0.1:3000/ # loopback readiness-probe target; getHost exposes the 0.0.0.0 port
    readyTimeoutMs: 60000
  state:
    # Seed the shared plane ONCE, before the server starts. Persisted as a command DIGEST only.
    seed:
      - name: seed-tasks
        command: python3 humanish/fixtures/shared-world-app/seed.py
        when: before-start
    # Read-only digest probe the background prober runs on a cadence (baseline + periodic + final).
    # Prints an AGGREGATE (count + hash), never row contents; only sha256-16(scrubbed stdout)
    # persists. The task count GROWING as actors add tasks IS the observed stateSeries delta.
    checkpoint:
      - name: task-count
        command: python3 humanish/fixtures/shared-world-app/checkpoint.py
actor:
  type: openai-computer-use # REAL dispatch key: resolves in the actor registry
  mission: >-
    You are one of several people planning work together. You have one task to share with the
    group. See whether this board helps you record it so the others know what needs doing.
# The roster IS the persona roster (>= 2). On the CONCURRENT route every persona drives the SAME
# getHost URL AT ONCE (the fixture's single page); each gets its OWN desktop sandbox, so the
# per-persona device is physically honored here.
participants:
  - id: persona-planner
    actorType: planner
    surface: task-board
    caseGroup: board-001
    persona: weekly-planner
    device: desktop
    instruction: Add one task describing planning the week, then stop.
  - id: persona-coordinator
    actorType: coordinator
    surface: task-board
    caseGroup: board-001
    persona: ops-coordinator
    device: desktop
    instruction: Add one task describing coordinating an operations handoff, then stop.
  - id: persona-mobile
    actorType: contributor
    surface: task-board
    caseGroup: board-001
    persona: on-the-go-contributor
    device: mobile
    instruction: From a phone, add one quick task describing a follow-up, then stop.
execution:
  target: e2b-desktop # required: each persona drives a hosted desktop browser
  # PER-PERSONA budget: 15 minutes is this lab's exact fit (15m + 30m provisioning + 5m seed +
  # 10m buffer = E2B's one-hour sandbox cap).
  timeoutMs: 900000
  concurrency: 3 # all 3 participants live at once (also the default when omitted: concurrency = participant count); lower it only to cap simultaneous paid desktops
