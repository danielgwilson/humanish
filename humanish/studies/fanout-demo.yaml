schema: humanish.study.v3
id: fanout-demo
title: "Computer-use fan-out: four participants in separate worlds (dry run)"
description: >-
  Four personas use one loopback app, each on its own E2B desktop. A dry run, the default, writes one run bundle
  with four contract streams and the pre-flight spend and participant plan at no cost; no desktop starts and no
  provider tokens are spent. A live run needs OPENAI_API_KEY, E2B_API_KEY and scenario.mode: live, and
  execution.concurrency bounds how many paid desktops run at once.
route: computer-use
subject:
  source: app-url
  appUrl: http://127.0.0.1:3000/ # loopback: each participant drives its own sandbox copy
actor:
  type: openai-computer-use # REAL dispatch key: resolves in the actor registry
  mission: Explore the app, complete the primary task for your persona, and stop when done.
# A differentiated roster: per-participant persona + device + starting steer. `lanes` is XOR with
# `count` (homogeneous) and XOR with `laneFocus`; an entry's `device` is XOR with a raw
# execution.desktop.resolution. Hard cap 16 participants; ids default lane-01..lane-NN.
participants:
  - id: mobile-newcomer
    persona: first-time-visitor
    device: mobile
    instruction: Sign up and reach the first value moment from a phone.
  - id: small-mobile-skimmer
    persona: impatient-skimmer
    device: small-mobile
    instruction: Skim the landing page and bounce if the value is not obvious in 10 seconds.
  - id: desktop-power
    persona: power-user
    device: desktop
    instruction: Find the advanced settings and change one preference.
  - id: wide-researcher
    persona: comparison-shopper
    device: wide
    instruction: Compare plans and locate the pricing details.
execution:
  target: e2b-desktop # required: each participant drives a hosted desktop browser
  timeoutMs: 900000 # PER-PARTICIPANT session budget (no run-level wall clock); a real journey needs room to finish
  concurrency: 2 # a deliberate CAP for the demo: participants run in waves of 2. Omit it and all participants run at once (the default); the env override may only LOWER this
  # scenario:
  #   mode: live # uncomment to spend: needs OPENAI_API_KEY + E2B_API_KEY
