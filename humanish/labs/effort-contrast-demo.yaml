schema: humanish.lab.v2
id: effort-contrast-demo
title: Is the effort axis load-bearing? (one persona, one mission, two reasoning efforts)
description: >
  A CONTRAST, not a confound check — the sibling of persona-contrast-demo. Two lanes
  clone and drive the SAME app with the SAME persona and the SAME mission, and differ in
  exactly one variable: how hard the model is asked to think.
  WHY THIS EXISTS: reasoning effort was reachable in the provider and unreachable from a
  lab, so every computer-use run humanish had ever done was the provider default — not by
  decision but by omission (#497). The problem with that is NOT that medium is the wrong
  setting. It is that effort changes who the participant is, the same way a persona
  prompt does, and we were varying the persona while silently pinning the other half.
  Every persona finding we have filed is really a finding about that persona AT MEDIUM,
  and we never said the second half out loud.
  So a lane that abandons at medium and completes at high has told you about two
  participants, not about a broken instrument. See docs/principles/actor-fidelity.md:
  capability settings are recruiting decisions, and the obligation they create is to
  declare and record, not to control.
  WHAT TO COMPARE afterwards (per lane, from the run bundle): completion reason, action
  count and mix, wall-clock to terminal state, how early the lane stopped, whether it
  reported friction, the affordance classes it used, and the estimated cost — a more
  capable participant costs more to recruit, so a delta that costs 3x is a different
  finding from one that costs 1.1x. Each trace records the effort that produced it in
  `modelSettings.reasoningEffort`, so the comparison never depends on remembering the
  config.
  If the two lanes come back indistinguishable, that is worth knowing too: it means this
  dial does not move behavior on this task, and the default was not quietly deciding our
  results. One run proves nothing about scale or repeatability either way.
  Committed as mode: dry-run, so the checked-in fixture builds a contract bundle at $0 and
  launches no sandbox. A live run needs OPENAI_API_KEY + E2B_API_KEY and a gitignored
  .humanish/labs/ copy with mode: live.
subject:
  source: clone
  repos:
    - drawdb-io/drawdb # the same public OSS subject the persona contrast uses, for comparability
  clone:
    depth: 1
  serve:
    install: npm install --no-audit --no-fund
    build: npm run build
    start: npx vite preview --host 127.0.0.1 --port 3000
    url: http://127.0.0.1:3000/
actors:
  - type: openai-computer-use
    persona: synthetic-new-user # ONE persona for both lanes: effort is the only declared difference
    mission: >-
      Create a small database diagram with at least two related tables, then stop.
    reasoningEffort: medium # the lane default, and the level every prior humanish run silently used
    lanes:
      - id: default-effort
        instruction: Build the diagram the way you normally would, and stop when you are done or blocked.
      - id: harder-effort
        reasoningEffort: high # the ONLY declared difference between the two lanes
        instruction: Build the diagram the way you normally would, and stop when you are done or blocked.
execution:
  target: e2b-desktop # both lanes live at once (the default: concurrency = seat count)
  timeoutMs: 1200000 # PER-LANE budget; a short cap suppresses the axis under study — higher effort spends its gain on longer horizons
  caps:
    maxUsd: 15 # fail-closed per-lane spend abort; the run-level worst case is 2x this
scenario:
  mode: dry-run # committed fixture stays contract-only
defaults:
  open: false
