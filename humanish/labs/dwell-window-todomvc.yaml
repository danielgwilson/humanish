schema: humanish.lab.v2
id: dwell-window-todomvc
title: "A declared observation window on TodoMVC (#510): hold for a minute after the first task lands, then continue"
description: >
  One participant adds a task; when the list says "1 item left" the harness holds the page for 60 s,
  capturing a frame every 10 s and requesting no model turn; then the participant continues and adds
  a second task. The bundle's trace carries the window (started/complete notices, six dwell frames),
  and no model turn is requested during it. Receipt:
  docs/goals/computer-use-actor/receipts/dwell-window-2026-09-04.md.
  Committed as mode: dry-run. A live run needs OPENAI_API_KEY and E2B_API_KEY and costs about $0.05.
subject:
  source: clone
  repos:
    - tastejs/todomvc
  clone:
    depth: 1
  serve:
    start: python3 -m http.server 3000 --directory examples/javascript-es6/dist
    url: http://127.0.0.1:3000/
actors:
  - type: openai-computer-use
    persona: synthetic-new-user
    mission: >-
      Add one task called "water the plants". The study will then hold the page for a while; when you are asked to continue, add a second task called "call the bank", then stop. Report what you did.
    dwell:
      when:
        any:
          - id: one-left
            textIncludes: "1 item left"
      ms: 60000
      everyMs: 10000
      then: continue
    tasks:
      - id: first-task
        goal: Add the first task.
        success:
          any:
            - id: one-left
              textIncludes: "1 item left"
      - id: second-task
        goal: Add the second task.
        success:
          any:
            - id: two-left
              textIncludes: "2 items left"
execution:
  target: e2b-desktop
  timeoutMs: 300000
  caps:
    maxUsd: 2
    maxTotalUsd: 2
scenario:
  mode: dry-run
defaults:
  open: false
policies:
  allowPrivateRepoAccess: false
  allowProviderCredentials: false
  allowPaymentCredentials: false
  allowGitHubMutation: false
