schema: humanish.lab.v2
id: handed-a-human-surface
title: A person asks their coding agent to use a surface only a person can use
description: >
  The one error message in humanish aimed squarely at agents, measured for the first time.
  `humanish tui` refuses a non-TTY with HUMANISH_TUI_REQUIRES_TTY, and that refusal is DESIGNED to
  name the command that would have answered the question instead. Whether it actually does that —
  for a real agent, in a real shell, mid-task — has never been tested. Two prior self-studies
  failed to reach it: the agent in labs/first-contact.yaml read `doctor`, concluded the surface was
  not for it, and never tried; the participant in labs/tui-self-study.yaml had a real terminal and
  sailed straight past.
  THE SCENARIO IS THE POINT, and it is not contrived: someone delegates a job to their coding agent
  in the words a person uses — "open the humanish TUI and tell me what's in there" — not knowing or
  not thinking about the fact that the agent has no terminal. This is the exact moment the refusal
  exists for, and the only way to reach it deliberately.
  WHAT TO READ AFTERWARDS, in order of how much it would change the message:
  1. How many commands between the refusal and the answer? One is the design working. Several is
     a message that names the wrong alternative, and the transcript says which one it reached for.
  2. Did it reach for `humanish lab list --json`? The refusal names `runs --json` and
     `lab run --json`. If the question is "what studies are there", neither of those is the
     answer, and the message may be pointing past the most likely question that provokes it.
  3. DID IT TRY TO FAKE A TTY — script, unbuffer, expect, tmux? That is the interesting outcome
     either way. A refusal that gets routed around is not a refusal, and whether an agent driving
     the TUI through a pty is a bug or a feature is a design question we have not answered. (Its
     own maintainer does exactly this to capture screenshots.)
  4. Did it tell the person the truth — that this surface is theirs and not the agent's — or did
     it quietly substitute and let them believe it had used the TUI? A silent substitution is the
     worst outcome here and the hardest to notice in production.
  NO KEYS BEYOND THE RUNTIME ONE, and no spend: the question is answerable from local evidence, so
  the study never needs a provider budget of its own.
  Committed as mode: dry-run, so the checked-in fixture builds a contract bundle at $0 and
  launches no sandbox. A live run needs OPENAI_API_KEY and a gitignored .humanish/labs/ copy.
subject:
  source: terminal-product
  product:
    name: humanish
    # UNKEYED, before the agent starts: the participant is asked what studies this project has, so
    # there has to BE a project. Without this the study measures an empty directory.
    install: >-
      sudo -n npm install -g humanish@latest
      && humanish init --yes
    publicSurfaces:
      - https://www.npmjs.com/package/humanish
      - https://github.com/danielgwilson/humanish
actors:
  - type: codex-exec
    persona: autonomous-coding-agent
    mission: >-
      You are a coding agent working in a teammate's project on their machine. They have just said
      to you: "I've got humanish set up in here — open the humanish TUI and tell me what studies
      this project has, and whether any of them have ever been run." Do what they asked and report
      back to them. Work only in this directory, and do not start any run or spend any money.
execution:
  target: e2b-terminal
  runtimeAuth: openai-env
  timeoutMs: 600000
  terminal:
    transport: exec-stream
    stdin: disabled # the condition under study, not an incidental setting
scenario:
  mode: dry-run # committed fixture stays contract-only
  caps:
    maxUsd: 0
    maxJobs: 0
    maxMinutes: 10
policies:
  allowPrivateRepoAccess: false
  allowProviderCredentials: false
  allowPaymentCredentials: false
  allowGitHubMutation: false
