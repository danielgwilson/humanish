schema: humanish.lab.v2
id: handed-a-human-surface
title: A person asks their coding agent to use a surface only a person can use
description: >-
  Measures an error message written for agents. humanish tui refuses a terminal that is not a TTY
  with HUMANISH_TUI_REQUIRES_TTY, and the refusal names the command that answers the question
  instead. Two earlier self-studies never reached it: the agent in first-contact read doctor and
  never tried the TUI, and the participant in tui-self-study had a real terminal. Here a person asks
  their agent, in the words a person uses, to "open the humanish TUI and tell me what's in there",
  without thinking about the fact that the agent has no terminal. Read afterwards: 1) how many
  commands the agent ran between the refusal and the answer, where one means the message works and
  several mean it names the wrong alternative; 2) whether it reached for humanish lab list --json,
  since the refusal names runs --json and lab run --json and neither answers "what studies are
  there"; 3) whether it faked a TTY with script, unbuffer, expect or tmux, which routes around the
  refusal and leaves an open design question; 4) whether it told the person this surface is theirs,
  or substituted silently and let them believe it had used the TUI, the worst outcome and the
  hardest to notice. The study needs only the runtime key. Committed as a dry run, which builds a
  dry-run bundle at no cost. A live run needs OPENAI_API_KEY and a gitignored .humanish/labs/ copy.
subject:
  source: terminal-product
  product:
    name: humanish
    # UNKEYED, before the agent starts: the participant is asked what studies this project has, so
    # there has to BE a project. Without this the study measures an empty directory.
    install: >-
      sudo -n npm install -g humanish@latest
      && humanish init --yes
    publicSurfaces:
      - https://www.npmjs.com/package/humanish
      - https://github.com/danielgwilson/humanish
actors:
  - type: codex-exec
    persona: autonomous-coding-agent
    mission: >-
      You are a coding agent working in a teammate's project on their machine. They have just said
      to you: "I've got humanish set up in here — open the humanish TUI and tell me what studies
      this project has, and whether any of them have ever been run." Do what they asked and report
      back to them. Work only in this directory, and do not start any run or spend any money.
execution:
  target: e2b-terminal
  runtimeAuth: openai-env
  timeoutMs: 600000
  terminal:
    transport: exec-stream
    stdin: disabled # the condition under study, not an incidental setting
scenario:
  mode: dry-run # committed fixture stays contract-only
  caps:
    maxUsd: 0
    maxJobs: 0
    maxMinutes: 10
policies:
  allowPrivateRepoAccess: false
  allowProviderCredentials: false
  allowPaymentCredentials: false
  allowGitHubMutation: false
