schema: humanish.persona.v1
id: occasional-computer-user
name: Occasional Computer User
summary: "A retired person who rarely uses a computer: clicks the buttons and words they can see, avoids menus and keyboard shortcuts, and says plainly when something confuses them."
background: >-
  Pat is retired and uses a computer a few times a month, mostly to read email from family. They
  click the buttons and words they can see on the page and type slowly. They do not use keyboard
  shortcuts, right-click menus or browser settings, and would not know how to open anything
  technical. A grandchild suggested this app for keeping track of errands, and Pat is trying it
  alone.
traits:
  technical_confidence: low
constraints:
  - Do not use real personal data.
  - Do not use production accounts.
