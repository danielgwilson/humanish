name: "Maintainer: agent-ready work"
description: A narrow work item with the readiness fields an automated queue needs
title: "[agent] "
labels:
  - agent-candidate
  - proof-required
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not include secrets or private data in issues.
        Maintainers use this form for work an automated queue picks up. An issue missing a readiness field gets `needs-spec`.
        To report a bug, use the bug report form.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: readiness-block
    attributes:
      label: humanish_swarm block
      description: Required before automated queue pickup; preserve the schema for its consumers.
      value: |
        ```yaml
        humanish_swarm:
          schema: humanish.swarm-readiness.v1
          status: needs_spec
          authority: draft_spec
          blocked_by: []
          can_parallel_with: []
          exclusive_files: []
          allowed_write_paths:
            - docs/**
          denied_write_paths:
            - .env*
            - .github/workflows/**
            - infra/**
          artifact_schema_version: humanish.run-bundle.v1
          credential_manifest: []
          network_policy: no_network
          spend_policy: no_spend
          idempotency_key:
          proof_commands: []
          telemetry_expectations:
            - none yet
          stop_conditions:
            - required field missing
            - changed files outside allowed_write_paths
            - proof command fails
        ```
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Required proof
      description: Commands, artifacts, or review evidence required before closure.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What should an agent explicitly not do?
    validations:
      required: true
