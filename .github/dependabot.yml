version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm's one-day minimumReleaseAge.
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the engines.node floor (22) so code cannot call newer Node APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
