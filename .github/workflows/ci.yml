name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue tests each PR on top of main and the PRs ahead of it before it merges.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release gate, split so the vitest suite runs in shards beside the rest of it. `check` and
  # `release:check` compose the same scripts locally: check:pre, test, then release:check:rest.
  checks:
    name: checks (node-${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engines.node floor in package.json.
          - node: floor
            node-version: "22.19.0"
          # The Active LTS line.
          - node: lts
            node-version: "24"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pre && pnpm release:check:rest
        env:
          HUMANISH_PUBLIC_DENYLIST_PATTERN: ${{ secrets.HUMANISH_PUBLIC_DENYLIST_PATTERN }}

  vitest:
    name: vitest (node-${{ matrix.node }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [floor, lts]
        shard: [1, 2, 3]
        include:
          - node: floor
            node-version: "22.19.0"
          - node: lts
            node-version: "24"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/3
        env:
          HUMANISH_PUBLIC_DENYLIST_PATTERN: ${{ secrets.HUMANISH_PUBLIC_DENYLIST_PATTERN }}

  test:
    # Stable check names for the required-checks ruleset. A job whose needs failed is skipped, and
    # a skipped required check counts as passing, so this job always runs and fails unless every
    # part of the gate succeeded.
    name: test (node-${{ matrix.node }})
    needs: [checks, vitest]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [floor, lts]
    steps:
      - run: |
          echo "checks: ${{ needs.checks.result }}, vitest: ${{ needs.vitest.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.vitest.result }}" = success

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm --filter humanish-site typecheck
      - run: pnpm --filter humanish-site registry:check
      - run: pnpm --filter humanish-site build
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm site:hero:proof

  observer:
    runs-on: ubuntu-latest
    # The proofs drive a real browser; a hung one would otherwise hold the job for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter humanish-observer typecheck
      # Build before test: the artifact smoke test asserts against dist/index.html.
      - run: pnpm build
      - run: pnpm --filter humanish-observer test
      - run: pnpm exec playwright-core install --with-deps chromium
      # Use the runner's installed Chrome with its sandbox enabled for control conformance.
      - run: pnpm browser-control:proof
        timeout-minutes: 5
        env:
          HUMANISH_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - run: pnpm observer:iframe:proof
        timeout-minutes: 5
      - run: pnpm observer:browser:proof
        timeout-minutes: 12
      - run: pnpm observer:chrome:proof
        timeout-minutes: 5
      - run: pnpm observer:reliability:proof
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: observer-browser-proof
          path: |
            .humanish/browser-control-proof/
            .humanish/observer-browser-proof/
            .humanish/observer-chrome-proof/
            .humanish/observer-reliability/
            .humanish/review/observer-iframe-proof.json
          retention-days: 14
          include-hidden-files: true

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter humanish-tui typecheck
      # Text goldens render through real yoga layout at fixed widths; no build step needed, the
      # bundle's own load-time smoke runs inside `release:check` on both Node versions.
      - run: pnpm --filter humanish-tui test

  guest-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect guest changes
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base="${PR_BASE:-HEAD^}"
          # A release changes package.json's version alone; that builds no different guest image.
          other_package_lines="$(git diff -U0 "$base" HEAD -- package.json | grep -E '^[+-][^+-]' | grep -vE '^[+-][[:space:]]*"version":' || true)"
          if [ -z "$other_package_lines" ] && git diff --quiet "$base" HEAD -- runtime/browser-guest 'src/guest-*.ts' src/guest/ src/substrates/x11/ src/evidence/frame-signature.ts src/browser-control/protocol.ts src/actors/computer-use/executor-error.ts src/actors/computer-use/executor-diagnostic.ts src/actors/computer-use/speech.ts 'scripts/guest-desktop-*.mjs' 'tests/guest-*.test.ts' tests/guest/ tests/substrates/x11/ tsconfig.build.json pnpm-lock.yaml .github/workflows/ci.yml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.needed == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.needed == 'true'
        with:
          node-version: "24"
          cache: pnpm
      - name: Build the pinned native image and driver
        if: steps.changes.outputs.needed == 'true'
        run: |
          python3 -B -m unittest discover -s runtime/browser-guest/tests -p '*_test.py' -v
          # Docker Hub sometimes refuses GitHub's shared runners for minutes at a time. The base is
          # pinned by digest, so a retry builds the same image.
          for attempt in 1 2 3; do
            if python3 runtime/browser-guest/build.py --architecture amd64 --output "$RUNNER_TEMP/guest-image-$attempt"; then
              mv "$RUNNER_TEMP/guest-image-$attempt" "$RUNNER_TEMP/guest-image"
              break
            fi
            tail -20 "$RUNNER_TEMP/guest-image-$attempt/build.log" || true
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 60))
          done
          pnpm install --frozen-lockfile
          pnpm exec tsc -p tsconfig.build.json
      - name: Prove headed input with Chromium sandbox enabled
        if: steps.changes.outputs.needed == 'true'
        run: |
          HUMANISH_GUEST_IMAGE="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "guest-image/manifest.json")))["image"]["id"])')" pnpm guest-desktop:proof
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.needed == 'true'
        with:
          name: guest-desktop-proof
          path: |
            .humanish/guest-desktop-proof/
            ${{ runner.temp }}/guest-image/manifest.json
            ${{ runner.temp }}/guest-image/build.log
          retention-days: 14
          include-hidden-files: true

  # The release's packed check (`pnpm packed:check`) on this tree's tarball. It is not a required
  # check: its rows reach npm and E2B's API, so an outage there must not hold a merge. The job
  # always runs and its first step decides whether the rows do. A workflow-level `paths` filter
  # would leave a skipped check pending instead of reporting it.
  packed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect package changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # package.json `files`, with dist/ replaced by what builds it, and the check itself.
          mapfile -t paths < <(node -p 'require("./package.json").files.filter((file) => file !== "dist").join("\n")')
          paths+=(src observer tui tsconfig.json tsconfig.build.json scripts/finish-build.mjs)
          paths+=(pnpm-lock.yaml pnpm-workspace.yaml)
          paths+=(package.json scripts/packed-check.sh .github/workflows/ci.yml)
          if git diff --quiet "$PR_BASE" HEAD -- "${paths[@]}"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No file the package ships or builds from changed, so the packed check did not run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.needed == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.needed == 'true'
        with:
          node-version: "24"
          cache: pnpm
      # One row runs the package's analysis provider under Bun; 1.3.11 is the version it last passed on.
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.needed == 'true'
        with:
          bun-version: "1.3.11"
      - if: steps.changes.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Pack this tree and run the rows
        if: steps.changes.outputs.needed == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          pnpm packed:check | tee "$RUNNER_TEMP/packed-check.txt"
      - name: Write the table to the job summary
        if: always() && steps.changes.outputs.needed == 'true'
        run: sed -n '/ packed check, /,$p' "$RUNNER_TEMP/packed-check.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: failure() && steps.changes.outputs.needed == 'true'
        with:
          name: packed-check-logs
          path: ${{ runner.temp }}/humanish-packed-check-*/logs/
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Full-history secret scan (license-free CLI via Docker; no GITLEAKS_LICENSE needed).
      # Scoped to THIS ref's ancestry. `--all` walks every ref present in the clone, so one
      # unmerged branch carrying a finding failed CI on every other open PR, which is what
      # happened on 2026-08-31. Coverage is unchanged in practice: every branch runs this job,
      # so a secret is still caught on the PR that introduces it, and `--full-history HEAD`
      # still walks the whole ancestry rather than the diff.
      # gitleaks publishes the same image to GHCR, which GitHub's runners reach without Docker Hub.
      - name: Scan full git history for secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --log-opts="--full-history HEAD" --redact --no-banner
