name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.14.0"
          - "24"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
        env:
          HUMANISH_PUBLIC_DENYLIST_PATTERN: ${{ secrets.HUMANISH_PUBLIC_DENYLIST_PATTERN }}

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm --filter humanish-site typecheck
      - run: pnpm --filter humanish-site registry:check
      - run: pnpm --filter humanish-site build

  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter humanish-observer typecheck
      # Build before test: the artifact smoke test asserts against dist/index.html.
      - run: pnpm build
      - run: pnpm --filter humanish-observer test
      - run: pnpm exec playwright-core install --with-deps chromium
      # Use the runner's installed Chrome with its sandbox enabled for control conformance.
      - run: pnpm browser-control:proof
        env:
          HUMANISH_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - run: pnpm observer:iframe:proof
      - run: pnpm observer:browser:proof
      - run: pnpm observer:chrome:proof
      - run: pnpm observer:reliability:proof
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: observer-browser-proof
          path: |
            .humanish/browser-control-proof/
            .humanish/observer-browser-proof/
            .humanish/observer-chrome-proof/
            .humanish/observer-reliability/
            .humanish/review/observer-iframe-proof.json
          retention-days: 14
          include-hidden-files: true

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter humanish-tui typecheck
      # Text goldens render through real yoga layout at fixed widths; no build step needed, the
      # bundle's own load-time smoke runs inside `release:check` on both Node versions.
      - run: pnpm --filter humanish-tui test

  guest-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect guest changes
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-HEAD^}"
          if git diff --quiet "$base" HEAD -- runtime/browser-guest 'src/guest-*.ts' src/frame-signature.ts src/browser-control-protocol.ts src/cua-executor-error.ts 'scripts/guest-desktop-*.mjs' 'tests/guest-*.test.ts' package.json tsconfig.build.json pnpm-lock.yaml .github/workflows/ci.yml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.needed == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.needed == 'true'
        with:
          node-version: "22.14.0"
          cache: pnpm
      - name: Build the pinned native image and driver
        if: steps.changes.outputs.needed == 'true'
        run: |
          python3 -B -m unittest discover -s runtime/browser-guest/tests -p '*_test.py' -v
          python3 runtime/browser-guest/build.py --architecture amd64 --output "$RUNNER_TEMP/guest-image"
          pnpm install --frozen-lockfile
          pnpm exec tsc -p tsconfig.build.json
      - name: Prove headed input with Chromium sandbox enabled
        if: steps.changes.outputs.needed == 'true'
        run: |
          HUMANISH_GUEST_IMAGE="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "guest-image/manifest.json")))["image"]["id"])')" pnpm guest-desktop:proof
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.needed == 'true'
        with:
          name: guest-desktop-proof
          path: |
            .humanish/guest-desktop-proof/
            ${{ runner.temp }}/guest-image/manifest.json
            ${{ runner.temp }}/guest-image/build.log
          retention-days: 14
          include-hidden-files: true

  broker-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 --version
      - run: python3 -B -m unittest discover -s runtime/broker/tests -p '*_test.py' -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Full-history secret scan (license-free CLI via Docker; no GITLEAKS_LICENSE needed).
      # Scoped to THIS ref's ancestry. `--all` walks every ref present in the clone, so one
      # unmerged branch carrying a finding failed CI on every other open PR, which is what
      # happened on 2026-08-31. Coverage is unchanged in practice: every branch runs this job,
      # so a secret is still caught on the PR that introduces it, and `--full-history HEAD`
      # still walks the whole ancestry rather than the diff.
      - name: Scan full git history for secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --log-opts="--full-history HEAD" --redact --no-banner
