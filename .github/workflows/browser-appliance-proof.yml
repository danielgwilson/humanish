name: Browser appliance proof

on:
  pull_request:
    paths:
      - runtime/browser-media/**
      - runtime/browser-guest/**
      - runtime/browser-kernel/**
      - runtime/browser-disk/**
      - runtime/runtime-assets/**
      - src/guest-*.ts
      - src/browser-control-*.ts
      - src/frame-signature.ts
      - src/cua-executor-error.ts
      - src/cua-speech.ts
      - scripts/guest-runtime-*.mjs
      - scripts/guest-desktop-*.mjs
      - tests/guest-*.test.ts
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - tsconfig.build.json
      - .github/workflows/browser-appliance-proof.yml
  push:
    branches: [main]
    paths:
      - runtime/browser-media/**
      - runtime/browser-guest/**
      - runtime/browser-kernel/**
      - runtime/browser-disk/**
      - runtime/runtime-assets/**
      - src/guest-*.ts
      - src/browser-control-*.ts
      - src/frame-signature.ts
      - src/cua-executor-error.ts
      - src/cua-speech.ts
      - scripts/guest-runtime-*.mjs
      - scripts/guest-desktop-*.mjs
      - tests/guest-*.test.ts
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - tsconfig.build.json
      - .github/workflows/browser-appliance-proof.yml
  workflow_dispatch:
    inputs:
      arm64_candidate:
        description: Build a native ARM64 runtime candidate and corresponding sources
        type: boolean
        default: false

      media_candidate:
        description: Include optional camera and speech in the ARM64 candidate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: appliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-artifacts:
    if: ${{ !inputs.arm64_candidate }}
    # Ordinary disposable VM and Docker only; no KVM, sudo or host mounts.
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Exercise build contracts without containers
        run: |
          python3 -B -m unittest discover -s runtime/runtime-assets/tests -v
          python3 -B -m unittest discover -s runtime/browser-kernel/tests -v
          python3 -B -m unittest discover -s runtime/browser-media/tests -v
          python3 -B -m unittest discover -s runtime/browser-disk/tests -v
          python3 -B -m unittest discover -s runtime/browser-guest/control/tests -v
      - name: Compile the fixed runtime payload
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -p tsconfig.build.json
          node scripts/guest-runtime-package.mjs "$RUNNER_TEMP/guest-payload"
      - name: Build the pinned offline base
        run: python3 runtime/browser-guest/build.py --architecture amd64 --output "$RUNNER_TEMP/browser-base"
      - name: Prove the constrained browser and packaged controller
        run: |
          HUMANISH_GUEST_IMAGE="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "browser-base/manifest.json")))["image"]["id"])')" node scripts/guest-runtime-proof.mjs
      - name: Verify source inputs and compile the matching browser kernel
        run: |
          python3 runtime/runtime-assets/fetch.py --output "$RUNNER_TEMP/boot-inputs"
          python3 runtime/browser-kernel/build.py --inputs "$RUNNER_TEMP/boot-inputs" --output "$RUNNER_TEMP/kernel-build" --jobs 2
      - name: Assemble and inspect both filesystems without mounting
        run: |
          python3 runtime/browser-disk/build.py \
            --base "$RUNNER_TEMP/browser-base" \
            --package "$RUNNER_TEMP/guest-payload" \
            --kernel-config "$RUNNER_TEMP/kernel-build/output/kernel.config" \
            --output "$RUNNER_TEMP/browser-disks"
      - name: Prove disk failure and interruption cleanup with an unrelated canary
        run: |
          disk_tools_image="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "browser-disks/manifest.json")))["toolsImage"]["id"])')"
          python3 runtime/browser-disk/proof.py --tools-image "$disk_tools_image" --output "$RUNNER_TEMP/disk-fault-proof"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # Retain receipts only. Guest/kernel/VMM bytes are not distributed.
          name: browser-appliance-receipts
          path: |
            .humanish/guest-runtime-proof/**/receipt.json
            .humanish/guest-runtime-proof/**/container.log
            .humanish/guest-runtime-proof/**/build.log
            ${{ runner.temp }}/guest-payload/manifest.json
            ${{ runner.temp }}/browser-base/manifest.json
            ${{ runner.temp }}/browser-base/build.log
            ${{ runner.temp }}/boot-inputs/manifest.json
            ${{ runner.temp }}/kernel-build/manifest.json
            ${{ runner.temp }}/kernel-build/cleanup.json
            ${{ runner.temp }}/kernel-build/build.log
            ${{ runner.temp }}/kernel-build/output/manifest.json
            ${{ runner.temp }}/browser-disks/manifest.json
            ${{ runner.temp }}/browser-disks/cleanup.json
            ${{ runner.temp }}/browser-disks/FAILED.json
            ${{ runner.temp }}/browser-disks/build.log
            ${{ runner.temp }}/browser-disks/output/*.json
            ${{ runner.temp }}/browser-disks/output/*.log
            ${{ runner.temp }}/browser-disks/failed-output/*.log
            ${{ runner.temp }}/disk-fault-proof/*.json
            ${{ runner.temp }}/disk-fault-proof/*.log
            ${{ runner.temp }}/disk-fault-proof/cases-output/*.json
            ${{ runner.temp }}/disk-fault-proof/cases-output/*.log
            ${{ runner.temp }}/disk-fault-proof/interrupted-build/FAILED.json
            ${{ runner.temp }}/disk-fault-proof/interrupted-build/cleanup.json
            ${{ runner.temp }}/disk-fault-proof/interrupted-build/build.log
          include-hidden-files: true
          retention-days: 14

  arm64-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64_candidate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Build native ARM64 runtime
        env:
          MEDIA_CANDIDATE: ${{ inputs.media_candidate }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -p tsconfig.build.json
          media_args=()
          if [[ "$MEDIA_CANDIDATE" == "true" ]]; then media_args+=(--media); fi
          python3 runtime/local-firecracker/build.py --output "$RUNNER_TEMP/runtime" "${media_args[@]}"
      - name: Retain matching sources and package candidate
        env:
          MEDIA_CANDIDATE: ${{ inputs.media_candidate }}
        run: |
          runtime_image="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "runtime/assets.json")))["image"])')"
          mkdir "$RUNNER_TEMP/candidate"
          docker image save "$runtime_image" | gzip -1 > "$RUNNER_TEMP/candidate/runtime-linux-arm64.tar.gz"
          cp "$RUNNER_TEMP/runtime/assets.json" "$RUNNER_TEMP/candidate/assets.json"
          media_args=()
          if [[ "$MEDIA_CANDIDATE" == "true" ]]; then
            media_args+=(--media-browser "$RUNNER_TEMP/runtime/media-browser" --media-inputs "$RUNNER_TEMP/runtime/media-inputs")
          fi
          python3 runtime/local-firecracker/sources.py \
            --browser "$RUNNER_TEMP/runtime/browser" --runtime-image "$runtime_image" \
            --boot-inputs "$RUNNER_TEMP/runtime/inputs" --kernel-build "$RUNNER_TEMP/runtime/kernel" \
            --output "$RUNNER_TEMP/sources" "${media_args[@]}"
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/sources/humanish-source.tar.gz"
          tar -C "$RUNNER_TEMP/sources" -czf "$RUNNER_TEMP/candidate/runtime-sources.tar.gz" .
          cd "$RUNNER_TEMP/candidate"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: arm64${{ inputs.media_candidate && '-media' || '' }}-runtime-candidate
          path: ${{ runner.temp }}/candidate/*
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-runtime-build-receipts
          path: |
            ${{ runner.temp }}/runtime/*.log
            ${{ runner.temp }}/runtime/*/manifest.json
            ${{ runner.temp }}/runtime/kernel/build.log
            ${{ runner.temp }}/runtime/browser/build.log
          retention-days: 14
