name: Caps

# Its own workflow, so a label or body edit re-runs only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: caps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cap-direction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: node scripts/check-cap-direction.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          RAISE_CAP: ${{ contains(github.event.pull_request.labels.*.name, 'raise-cap') }}
          PR_BODY: ${{ github.event.pull_request.body }}
